site_name: zalobot
site_description: Typed Python client and bot framework for the Zalo Bot Platform
repo_name: nttams/zalobot
repo_url: https://github.com/nttams/zalobot
site_url: https://nttams.github.io/zalobot/
strict: true
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Handlers and filters: handlers.md
      - Polling and webhooks: polling-webhooks.md
      - Rich text: rich-text.md
      - Errors and retries: errors.md
      - Testing your bot: testing.md
  - API reference: api.md
  - Changelog: changelog.md
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            docstring_style: sphinx
            show_signature_annotations: true
            separate_signature: true
