[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "zalobot-sdk"
version = "0.1.0"
description = "Typed Python client and bot framework for the Zalo Bot Platform (sync and async)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tâm Ngô", email = "ngothtam.me@gmail.com" }]
keywords = ["zalo", "zalobot", "bot", "chatbot", "vietnam", "asyncio", "webhook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Vietnamese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/nttams/zalobot"
Source = "https://github.com/nttams/zalobot"
Issues = "https://github.com/nttams/zalobot/issues"
Changelog = "https://github.com/nttams/zalobot/blob/main/CHANGELOG.md"
"Zalo Bot API" = "https://bot.zaloplatforms.com/docs/"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "twine>=6",
    "pytest-timeout>=2.3",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
examples = ["fastapi>=0.115", "flask>=3"]

[tool.uv.build-backend]
module-name = "zalobot"
source-include = ["tests/**", "examples/**", "docs/**", "mkdocs.yml", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Zalo Bot API (needs ZALOBOT_TEST_TOKEN and ZALOBOT_TEST_CHAT_ID)"]
addopts = "-m 'not live' --strict-markers"
timeout = 30

[tool.coverage.run]
source = ["zalobot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT", "TID"]
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109"]  # ASYNC109: get_updates(timeout) is the API field

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PT011", "PT018"]
"examples/**" = ["S104", "S105"]

[tool.mypy]
strict = true
python_version = "3.11"
